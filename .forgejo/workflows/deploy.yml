name: Deploy to Worker

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "wrangler.jsonc"
            - "package.json"
            - "nub.lock"
            - "worker-configuration.d.ts"
    workflow_dispatch:

concurrency:
    group: deploy-${{ forgejo.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Cloudflare Workers
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: https://github.com/actions/checkout@v7

            - name: Prepare Node environment
              shell: bash
              run: |
                  node_bin="$(dirname "$(readlink -f "$(command -v node)")")"
                  echo "$node_bin" >> "$GITHUB_PATH"
                  npm config set allow-scripts=@nubjs/nub --location=user

            # the job container runs with umask 0000, so nub's own mkdir leaves
            # /root/.cache and /root/.cache/nub world-writable, and it then refuses
            # that path as its runtime cache. Pre-create both; nub reuses an existing
            # directory without loosening its mode.
            - name: Prepare the nub cache dir
              shell: bash
              run: |
                  mkdir -p /root/.cache/nub
                  chmod 755 /root/.cache
                  chmod 700 /root/.cache/nub

            # ACTIONS_CACHE_URL is injected by the runner, and it embeds a one-time
            # token, so the log shows only the host. Skipped connection refused means
            # the job container cannot reach the runner's cache proxy, which
            # cache.host / actions_cache_url_override exist to fix. Never fails the job.
            - name: Check the cache endpoint
              shell: bash
              run: |
                  url="${ACTIONS_CACHE_URL:-}"
                  if [ -z "$url" ]; then
                      echo "ACTIONS_CACHE_URL is not set: the runner is not offering a cache"
                      exit 0
                  fi
                  echo "::add-mask::${url}"
                  echo "cache host: $(printf '%s' "$url" | cut -d/ -f3)"
                  curl -s -o /dev/null -w 'cache endpoint responded %{http_code}\n' --max-time 10 "$url" || echo "cache endpoint unreachable from this container"

            - name: Set up Nub
              uses: https://github.com/nubjs/setup-nub@v0
              with:
                  nub-version: "0.9.2"
                  cache: true
                  cache-dependency-path: nub.lock

            - name: Install dependencies
              run: nub ci

            - name: Verify lint, format and types
              run: |
                  nub run lint
                  nub run format:check
                  nub run typecheck

            - name: Deploy Worker
              run: nub run deploy --message "$(git log -1 --pretty=%s)"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
