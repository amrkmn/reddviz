name: Deploy to Worker

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "wrangler.jsonc"
            - "package.json"
            - "nub.lock"
            - "worker-configuration.d.ts"
    workflow_dispatch:

concurrency:
    group: deploy-${{ forgejo.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Cloudflare Workers
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: https://github.com/actions/checkout@v7

            - name: Prepare Node environment
              shell: bash
              run: |
                  node_bin="$(dirname "$(readlink -f "$(command -v node)")")"
                  echo "$node_bin" >> "$GITHUB_PATH"
                  npm config set allow-scripts=@nubjs/nub --location=user

            # /root/.cache does not exist in a fresh job container, and whatever
            # creates it first during the job does so world-writable here, which nub
            # refuses as a runtime cache ancestor. Creating it up front at 755 means
            # later steps inherit a usable parent instead.
            - name: Prepare the nub cache dir
              shell: bash
              run: |
                  umask
                  stat -c '%a %U %n' /root /root/.cache || true
                  mkdir -p /root/.cache
                  chmod 755 /root/.cache

            - name: Set up Nub
              uses: https://github.com/nubjs/setup-nub@v0
              with:
                  cache: false

            - name: Install dependencies
              run: nub ci

            - name: Verify lint, format and types
              run: |
                  nub run lint
                  nub run format:check
                  nub run typecheck

            - name: Deploy Worker
              run: nub run deploy --message "$(git log -1 --pretty=%s)"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
