name: Cut Release

on:
    push:
        tags:
            - "v*"

jobs:
    release:
        name: Publish Forgejo release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: https://github.com/actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up git-cliff
              uses: https://github.com/kenji-miyake/setup-git-cliff@v1

            - name: Generate release notes
              shell: bash
              run: git cliff --latest --strip header > release-notes.md

            - name: Publish release
              uses: https://code.forgejo.org/actions/forgejo-release@v2.9.1
              with:
                  direction: upload
                  url: https://noz.one
                  repo: ujol/reddviz
                  tag: ${{ github.ref_name }}
                  sha: ${{ github.sha }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  release-notes-file: release-notes.md
                  skip-assets: "true"
