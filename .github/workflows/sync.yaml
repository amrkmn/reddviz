name: Sync Repo

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: "0 */6 * * *"

jobs:
    gitlab:
        runs-on: ubuntu-latest
        steps:
            - uses: keninkujovic/gitlab-sync@2.0.0
              with:
                  gitlab_url: https://gitlab.com/ujol/reddviz.git
                  username: ujol
                  gitlab_pat: ${{ secrets.GITLAB_PAT }}
