# Release notes are generated by git-cliff from conventional commits.
# See `.forgejo/workflows/release.yml`. Do not edit release notes by hand.

[changelog]
header = """
# Changelog

All notable changes to ReddViz are documented here.
Generated by [git-cliff](https://github.com/orhun/git-cliff) — do not edit by hand.

"""
body = """
{% if version -%}
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits -%}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first | trim }} \
            (`{{ commit.id | truncate(length=7, end="") }}`)
    {%- endfor %}
{% endfor -%}
{% for commit in commits -%}
    {% if commit.breaking -%}
        {% if loop.first -%}
            ### Breaking Changes
        {% endif -%}
        - {{ commit.breaking_description | trim }} \
            (`{{ commit.id | truncate(length=7, end="") }}`)
    {%- endif %}
{%- endfor %}
"""
trim = true
footer = """
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^refactor", group = "Refactors" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Miscellaneous Chores" },
    { message = "^revert", group = "Reverts" },
]
